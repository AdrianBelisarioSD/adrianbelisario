<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calculadora | Adrian Belisario</title>
<link rel="icon" type="image/png" href="../../imagenes/web/logo-64.png">
<script>try{var t=localStorage.getItem('tema');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
<style>
@font-face{font-family:"Anybody";src:url("../../fuentes/anybody.woff2") format("woff2");font-weight:100 900;font-stretch:50% 150%;font-display:swap}
@font-face{font-family:"Instrument Sans";src:url("../../fuentes/instrument-sans.woff2") format("woff2");font-weight:400 700;font-display:swap}
[data-theme=dark]{--fondo:#12221C;--capa:#1A2E26;--capa2:#243A31;--texto:#E7F0EB;--tenue:#9CB4A9;--linea:rgba(231,240,235,.12);--teal:#5FBEB3;--sobre-teal:#0C1C17;--rosa:#E58E8C;color-scheme:dark}
[data-theme=light]{--fondo:#EDF1EE;--capa:#FFFFFF;--capa2:#DCE6E0;--texto:#12221C;--tenue:#4A6359;--linea:rgba(18,34,28,.14);--teal:#17786E;--sobre-teal:#FFFFFF;--rosa:#B8474C;color-scheme:light}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{display:grid;grid-template-rows:auto 1fr;gap:10px;padding:14px;font:600 16px/1 "Instrument Sans",system-ui,sans-serif;color:var(--texto);background:var(--fondo);transition:background-color .4s,color .4s}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.volver{display:none;justify-self:start;color:var(--tenue);font-size:.9rem;text-decoration:none;border-bottom:1px solid var(--linea)}
.suelta{max-width:420px;height:auto;min-height:100vh;margin:0 auto;padding-top:40px;grid-template-rows:auto auto auto}
.suelta .volver{display:inline-block}
.suelta{align-content:start}
.suelta .teclas{height:420px}
.pantalla{display:grid;gap:6px;justify-items:end;padding:12px 16px;border-radius:16px;background:var(--capa);border:1px solid var(--linea);min-width:0}
#expr{max-width:100%;overflow:hidden;font:800 clamp(1.6rem,9vw,2.4rem)/1.1 "Anybody",sans-serif;font-stretch:80%;white-space:nowrap;direction:rtl;text-align:right}
#expr bdi{direction:ltr}
#prev{min-height:1.1em;color:var(--tenue);font-size:.95rem;font-weight:500}
#prev.error{color:var(--rosa)}
.pop{animation:pop .3s cubic-bezier(.22,1,.36,1)}
@keyframes pop{from{transform:scale(.9);opacity:.5}}
.teclas{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:1fr;gap:8px;min-height:0}
.teclas button{border:0;border-radius:12px;background:var(--capa);font-size:1.15rem;cursor:pointer;transition:transform .12s,background-color .2s;min-height:36px}
.teclas button:hover{background:var(--capa2)}
.teclas button:active,.teclas button.pulsa{transform:scale(.93)}
.teclas .op{color:var(--teal);font-size:1.3rem}
.teclas .fn{color:var(--tenue)}
.teclas .igual{grid-row:span 2;background:var(--teal);color:var(--sobre-teal);font-size:1.4rem}
.teclas .igual:hover{background:var(--teal);filter:brightness(1.08)}
.teclas .cero{grid-column:span 2}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<a class="volver" href="../../index.html#proyectos">Volver al portafolio</a>
<div class="pantalla" role="status" aria-live="polite">
  <div id="expr"><bdi>0</bdi></div>
  <div id="prev"></div>
</div>
<div class="teclas">
  <button class="fn" data-k="C" aria-label="Borrar todo">C</button>
  <button class="fn" data-k="del" aria-label="Borrar el último">⌫</button>
  <button class="fn" data-k="%" aria-label="Porcentaje">%</button>
  <button class="op" data-k="÷" aria-label="Dividir">÷</button>
  <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
  <button class="op" data-k="×" aria-label="Multiplicar">×</button>
  <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
  <button class="op" data-k="−" aria-label="Restar">−</button>
  <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
  <button class="op" data-k="+" aria-label="Sumar">+</button>
  <button class="cero" data-k="0">0</button><button data-k="." aria-label="Punto decimal">.</button>
  <button class="igual" data-k="=" aria-label="Igual">=</button>
</div>
<script>
(() => {
  if (window.top === window) document.body.classList.add('suelta');
  const exprEl = document.querySelector('#expr bdi'), prevEl = document.getElementById('prev');
  const OPS = '+−×÷';
  let expr = '';

  // Calcula sin eval: primero %, luego × y ÷, al final + y −
  function calcular(s) {
    const t = s.match(/\d*\.?\d+|[+−×÷%]/g);
    if (!t) return null;
    const nums = [], ops = [];
    let i = 0, signo = 1;
    if (t[0] === '−') { signo = -1; i = 1; }
    while (i < t.length) {
      let n = parseFloat(t[i]); if (isNaN(n)) return null; n *= signo; signo = 1; i++;
      while (t[i] === '%') { n /= 100; i++; }
      nums.push(n);
      if (i < t.length) { if (!OPS.includes(t[i])) return null; ops.push(t[i]); i++; if (t[i] === '−' && OPS.includes(t[i - 1])) { signo = -1; i++; } }
    }
    if (nums.length !== ops.length + 1) return null;
    const n2 = [nums[0]], o2 = [];
    ops.forEach((o, k) => {
      const b = nums[k + 1];
      if (o === '×') n2.push(n2.pop() * b);
      else if (o === '÷') { if (b === 0) throw new Error('cero'); n2.push(n2.pop() / b); }
      else { o2.push(o); n2.push(b); }
    });
    let r = n2[0];
    o2.forEach((o, k) => { r = o === '+' ? r + n2[k + 1] : r - n2[k + 1]; });
    return Math.round(r * 1e10) / 1e10;
  }
  const formato = n => String(n).replace('-', '−');

  function pintar(final) {
    exprEl.textContent = expr || '0';
    prevEl.classList.remove('error'); prevEl.textContent = '';
    if (!expr || !/[+−×÷%]/.test(expr.slice(1)) || OPS.includes(expr.slice(-1))) return;
    try { const r = calcular(expr); if (r !== null && !final) prevEl.textContent = '= ' + formato(r); }
    catch (e) { prevEl.textContent = 'No se puede dividir entre 0'; prevEl.classList.add('error'); }
  }

  function pulsar(k) {
    const ult = expr.slice(-1);
    const numActual = expr.split(/[+−×÷]/).pop();
    if (/\d/.test(k)) { if (numActual === '0' && !numActual.includes('.')) expr = expr.slice(0, -1); expr += k; }
    else if (k === '.') { if (!numActual.includes('.')) expr += (numActual === '' || ult === '%') ? '0.' : '.'; }
    else if (OPS.includes(k)) {
      if (!expr) { if (k === '−') expr = '−'; }
      else if (OPS.includes(ult)) { if (k === '−' && ult !== '−' && expr.length > 1) expr += k; else expr = expr.slice(0, -1) + k; }
      else expr += k;
    }
    else if (k === '%') { if (expr && /[\d.]/.test(ult)) expr += '%'; }
    else if (k === 'C') expr = '';
    else if (k === 'del') expr = expr.slice(0, -1);
    else if (k === '=') {
      if (!expr || OPS.includes(ult)) return;
      try {
        const r = calcular(expr); if (r === null) return;
        expr = formato(r).replace('−', '−'); pintar(true);
        exprEl.parentElement.classList.remove('pop'); void exprEl.offsetWidth; exprEl.parentElement.classList.add('pop'); return;
      } catch (e) { pintar(); return; }
    }
    if (expr.length > 32) expr = expr.slice(0, 32);
    pintar();
  }

  document.querySelectorAll('.teclas button').forEach(b => b.addEventListener('click', () => pulsar(b.dataset.k)));
  const mapa = { '*': '×', 'x': '×', '/': '÷', '-': '−', '+': '+', 'Enter': '=', '=': '=', 'Backspace': 'del', 'Escape': 'C', 'Delete': 'C', ',': '.', '.': '.', '%': '%' };
  addEventListener('keydown', e => {
    const k = /^\d$/.test(e.key) ? e.key : mapa[e.key];
    if (!k) return;
    e.preventDefault(); pulsar(k);
    const b = document.querySelector(`.teclas button[data-k="${k}"]`);
    if (b) { b.classList.add('pulsa'); setTimeout(() => b.classList.remove('pulsa'), 120); }
  });
  addEventListener('storage', e => { if (e.key === 'tema' && e.newValue) document.documentElement.dataset.theme = e.newValue; });
})();
</script>
</body>
</html>
