<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lista de tareas | Adrian Belisario</title>
<link rel="icon" type="image/png" href="../../imagenes/web/logo-64.png">
<script>try{var t=localStorage.getItem('tema');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
<style>
@font-face{font-family:"Anybody";src:url("../../fuentes/anybody.woff2") format("woff2");font-weight:100 900;font-stretch:50% 150%;font-display:swap}
@font-face{font-family:"Instrument Sans";src:url("../../fuentes/instrument-sans.woff2") format("woff2");font-weight:400 700;font-display:swap}
[data-theme=dark]{--fondo:#12221C;--capa:#1A2E26;--capa2:#243A31;--texto:#E7F0EB;--tenue:#9CB4A9;--linea:rgba(231,240,235,.12);--teal:#5FBEB3;--sobre-teal:#0C1C17;--rosa:#E58E8C;color-scheme:dark}
[data-theme=light]{--fondo:#EDF1EE;--capa:#FFFFFF;--capa2:#DCE6E0;--texto:#12221C;--tenue:#4A6359;--linea:rgba(18,34,28,.14);--teal:#17786E;--sobre-teal:#FFFFFF;--rosa:#B8474C;color-scheme:light}
*{box-sizing:border-box;margin:0;padding:0}
body{height:100vh;display:flex;flex-direction:column;gap:12px;padding:16px;font:500 15px/1.4 "Instrument Sans",system-ui,sans-serif;color:var(--texto);background:var(--fondo);transition:background-color .4s,color .4s}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px;border-radius:8px}
.volver{display:none;align-self:flex-start;color:var(--tenue);font-size:.9rem;text-decoration:none;border-bottom:1px solid var(--linea)}
.suelta .volver{display:inline-block}
.suelta ul{flex:none}
.suelta .pie{margin-top:4px}
.suelta{height:auto;min-height:100vh;max-width:560px;margin:0 auto;padding-top:40px}
.cab{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
h1{font:800 1.6rem/1 "Anybody",sans-serif;font-stretch:78%}
#cuenta{color:var(--tenue);font-size:.88rem}
form{display:flex;gap:8px}
input[type=text]{flex:1;min-width:0;height:44px;padding:0 14px;border-radius:12px;border:1.5px solid var(--linea);background:var(--capa);transition:border-color .3s}
input[type=text]:focus{outline:none;border-color:var(--teal)}
.agitar{animation:agitar .4s}
@keyframes agitar{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.agregar{height:44px;padding:0 16px;border:0;border-radius:12px;background:var(--teal);color:var(--sobre-teal);font-weight:700;cursor:pointer;transition:transform .2s}
.agregar:active{transform:scale(.95)}
.filtros{display:flex;gap:6px}
.filtros button{min-height:34px;padding:0 12px;border-radius:99px;border:1.5px solid var(--linea);background:none;font-size:.85rem;font-weight:600;cursor:pointer;transition:background-color .3s,color .3s,border-color .3s}
.filtros button[aria-pressed=true]{background:var(--capa2);border-color:var(--capa2)}
ul{flex:1;display:grid;align-content:start;gap:6px;list-style:none;overflow:auto;min-height:0}
li{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 10px;border-radius:12px;background:var(--capa);border:1px solid var(--linea);animation:entra .35s cubic-bezier(.22,1,.36,1)}
@keyframes entra{from{opacity:0;transform:translateY(-8px)}}
li.sale{animation:sale .3s forwards}
@keyframes sale{to{opacity:0;transform:translateX(30px)}}
.check{position:relative;flex-shrink:0;width:22px;height:22px}
.check input{position:absolute;inset:0;z-index:1;margin:0;opacity:0;cursor:pointer}
.check span{display:grid;place-items:center;width:22px;height:22px;border-radius:7px;border:2px solid var(--tenue);transition:background-color .25s,border-color .25s}
.check span::after{content:"";width:6px;height:11px;margin-top:-3px;border:solid var(--sobre-teal);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) scale(0);transition:transform .25s cubic-bezier(.22,1,.36,1)}
.check input:checked+span{background:var(--teal);border-color:var(--teal)}
.check input:checked+span::after{transform:rotate(45deg) scale(1)}
.check input:focus-visible+span{outline:3px solid var(--teal);outline-offset:2px}
.txt{flex:1;min-width:0;overflow-wrap:anywhere;background:linear-gradient(currentColor,currentColor) 0 55%/0 1.5px no-repeat;transition:background-size .35s,color .3s}
.hecha .txt{color:var(--tenue);background-size:100% 1.5px}
.borrar{flex-shrink:0;display:grid;place-items:center;width:32px;height:32px;border:0;border-radius:8px;background:none;color:var(--tenue);font-size:1.2rem;cursor:pointer}
.borrar:hover{background:var(--capa2);color:var(--rosa)}
.vacio{padding:18px;text-align:center;color:var(--tenue);font-size:.9rem;background:none;border:1.5px dashed var(--linea);animation:none}
.pie{display:flex;justify-content:flex-end}
.limpiar{border:0;background:none;color:var(--tenue);font-size:.85rem;cursor:pointer;text-decoration:underline}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<a class="volver" href="../../index.html#proyectos">Volver al portafolio</a>
<div class="cab"><h1>Mis tareas</h1><span id="cuenta" aria-live="polite"></span></div>
<form id="form">
  <label for="nueva" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Nueva tarea</label>
  <input id="nueva" type="text" placeholder="Escribe una tarea" maxlength="80" autocomplete="off">
  <button class="agregar" type="submit">Agregar</button>
</form>
<div class="filtros" role="group" aria-label="Mostrar">
  <button type="button" data-f="todas" aria-pressed="true">Todas</button>
  <button type="button" data-f="pendientes" aria-pressed="false">Pendientes</button>
  <button type="button" data-f="hechas" aria-pressed="false">Hechas</button>
</div>
<ul id="lista"></ul>
<div class="pie"><button class="limpiar" id="limpiar" type="button">Borrar las hechas</button></div>
<script>
(() => {
  if (window.top === window) document.body.classList.add('suelta');
  const CLAVE = 'tareas-adrian';
  const lista = document.getElementById('lista'), cuenta = document.getElementById('cuenta');
  const form = document.getElementById('form'), nueva = document.getElementById('nueva');
  let filtro = 'todas';
  let tareas;
  try { tareas = JSON.parse(localStorage.getItem(CLAVE)); } catch (e) {}
  if (!Array.isArray(tareas)) tareas = [
    { id: 1, texto: 'Diseñar la pantalla de inicio', hecha: true },
    { id: 2, texto: 'Programar el formulario de contacto', hecha: false },
    { id: 3, texto: 'Publicar el sitio', hecha: false }
  ];
  const guardar = () => { try { localStorage.setItem(CLAVE, JSON.stringify(tareas)); } catch (e) {} };

  function pintar() {
    lista.textContent = '';
    const visibles = tareas.filter(t => filtro === 'todas' || (filtro === 'hechas' ? t.hecha : !t.hecha));
    if (!visibles.length) {
      const li = document.createElement('li'); li.className = 'vacio';
      li.textContent = filtro === 'hechas' ? 'Todavía no has terminado ninguna tarea.' : 'No hay tareas pendientes. Agrega una arriba.';
      lista.append(li);
    }
    visibles.forEach(t => {
      const li = document.createElement('li'); li.dataset.id = t.id; if (t.hecha) li.classList.add('hecha');
      const lab = document.createElement('label'); lab.className = 'check';
      const cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = t.hecha; cb.setAttribute('aria-label', 'Marcar como hecha: ' + t.texto);
      lab.append(cb, document.createElement('span'));
      const txt = document.createElement('span'); txt.className = 'txt'; txt.textContent = t.texto;
      const b = document.createElement('button'); b.className = 'borrar'; b.type = 'button'; b.textContent = '×'; b.setAttribute('aria-label', 'Borrar: ' + t.texto);
      li.append(lab, txt, b); lista.append(li);
    });
    const p = tareas.filter(t => !t.hecha).length;
    cuenta.textContent = p === 1 ? '1 pendiente' : p + ' pendientes';
  }

  form.addEventListener('submit', e => {
    e.preventDefault();
    const texto = nueva.value.trim();
    if (!texto) { nueva.classList.remove('agitar'); void nueva.offsetWidth; nueva.classList.add('agitar'); nueva.placeholder = 'Escribe algo para agregar'; nueva.focus(); return; }
    tareas.unshift({ id: Date.now(), texto, hecha: false });
    nueva.value = ''; nueva.placeholder = 'Escribe una tarea';
    if (filtro === 'hechas') ponerFiltro('todas');
    guardar(); pintar(); nueva.focus();
  });

  lista.addEventListener('change', e => {
    const li = e.target.closest('li'); const t = tareas.find(x => x.id == li.dataset.id);
    t.hecha = e.target.checked; li.classList.toggle('hecha', t.hecha); guardar();
    const p = tareas.filter(x => !x.hecha).length; cuenta.textContent = p === 1 ? '1 pendiente' : p + ' pendientes';
    if (filtro !== 'todas') setTimeout(pintar, 400);
  });

  lista.addEventListener('click', e => {
    const b = e.target.closest('.borrar'); if (!b) return;
    const li = b.closest('li'); li.classList.add('sale');
    setTimeout(() => { tareas = tareas.filter(x => x.id != li.dataset.id); guardar(); pintar(); }, 280);
  });

  function ponerFiltro(f) {
    filtro = f;
    document.querySelectorAll('.filtros button').forEach(b => b.setAttribute('aria-pressed', b.dataset.f === f));
  }
  document.querySelectorAll('.filtros button').forEach(b => b.addEventListener('click', () => { ponerFiltro(b.dataset.f); pintar(); }));
  document.getElementById('limpiar').addEventListener('click', () => { tareas = tareas.filter(t => !t.hecha); guardar(); pintar(); });

  // Si cambias el tema en el portafolio, la app lo sigue
  addEventListener('storage', e => { if (e.key === 'tema' && e.newValue) document.documentElement.dataset.theme = e.newValue; });
  pintar();
})();
</script>
</body>
</html>
